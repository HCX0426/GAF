[project]
name = "gaf"
# H22 fix: align with backend/config/app_info.py APP_VERSION (single source
# of truth). Update both files together when bumping the version.
version = "2.0.0"
description = "GAF - Game Automation Framework"
requires-python = ">=3.11"
dependencies = [
    "django>=5.2,<5.3",
    "djangorestframework>=3.15,<4.0",
    "djangorestframework-simplejwt>=5.3,<6.0",
    "django-cors-headers>=4.4,<5.0",
    "django-filter>=24.0,<25.0",
    "django-celery-beat>=2.6,<3.0",
    "channels>=4.1,<5.0",
    "channels-redis>=4.2,<5.0",
    "daphne>=4.1,<5.0",
    "celery>=5.4,<6.0",
    "redis>=5.0,<6.0",
    "python-dotenv>=1.0,<2.0",
    "Pillow>=10.4,<11.0",
    "drf-spectacular>=0.27,<1.0",
    "rapidocr-onnxruntime>=1.3",
    "opencv-python-headless>=4.10",
    "cryptography>=43.0,<44.0",
    "chromadb>=0.4.0",
    "fastembed>=0.7",
    # AI agent stack (LangChain 1.x + LangGraph 1.x).
    # langchain: create_agent (TD-102 migrated from langgraph.prebuilt.create_react_agent)
    # langchain-core: @tool decorator
    # langchain-openai: ChatOpenAI LLM adapter
    # langgraph: graph runtime (used by langchain.agents.create_agent internally)
    "langchain>=1.0,<2.0",
    "langchain-core>=1.0,<2.0",
    "langchain-openai>=1.0,<2.0",
    "langgraph>=1.0,<2.0",
    "pyotp>=2.9,<3.0",
    "requests>=2.31,<3.0",
    # APScheduler — dev scheduler.py (config/scheduler.py) 实际使用,
    # 此前仅 backend/requirements/base.txt 声明, pyproject 缺失导致
    # 用 pyproject 安装的环境缺依赖 (TD 配置漂移).
    "apscheduler>=3.10,<4.0",
    # D2 (评审 2026-09-05): config/settings/prod.py 的中间件与
    # STATICFILES_STORAGE 引用 whitenoise, 此前仅 backend/requirements/prod.txt
    # 声明 — 与 APScheduler 同类的 "requirements 有、pyproject 无" 配置漂移,
    # 裸机 prod 环境首个请求即 ModuleNotFoundError.
    "whitenoise>=6.7,<7.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5,<1.0",
    "mypy>=1.10,<2.0",
    "django-stubs>=5.0,<6.0",
    "djangorestframework-stubs>=3.15,<4.0",
    "pytest>=8.0,<9.0",
    "pytest-django>=4.8,<5.0",
    "pytest-asyncio>=0.23,<1.0",
    # spec-65 (TD-308-A): pytest-xdist for parallel test execution.
    # Cuts full backend pytest from 526s → ~150-200s (3-4x speedup on 4-8 cores).
    # Used with `-n auto` flag in N177 full-suite regression command.
    "pytest-xdist>=3.5,<4.0",
    "factory-boy>=3.3,<4.0",
    "playwright>=1.40,<2.0",
]
ocr-paddle = [
    # Optional PaddleOCR engine — heavy dependency (~hundreds of MB).
    # Default OCR engine is RapidOCR (rapidocr-onnxruntime in base deps).
    # Install with: pip install -e ".[ocr-paddle]"
    "paddleocr>=2.9",
]

[tool.ruff]
target-version = "py311"
line-length = 120
# Centralize all Python tool caches under .cache/ (gitignored) so the repo
# root stays clean. See .gitignore (.cache/, .pytest_cache/, .mypy_cache/,
# .ruff_cache/ — the latter three are kept as defensive fallbacks).
cache-dir = ".cache/ruff"
# Django auto-generates migration files with its own import ordering
# convention (django.db.models.deletion before stdlib uuid). Excluding
# migrations from ruff avoids I001 false positives on files we never
# hand-edit. Standard Django project practice.
extend-exclude = ["backend/*/migrations/*"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "N",
    "W",
    "UP",
    "B",
    "C4",
    "SIM",
]
ignore = [
    "E501",
]

[tool.ruff.lint.isort]
known-first-party = ["accounts", "agents", "ai", "config", "debug", "device_bridge", "gamestate", "metrics", "monitors", "notifications", "protocol", "qa", "resources", "skills", "tasks", "tracing"]

[tool.ruff.lint.per-file-ignores]
# __init__.py files re-export public API symbols by design; F401 false-positives
# are expected and silenced project-wide. Standard Python package convention.
"__init__.py" = ["F401"]
# DRF serializer fields use camelCase to match frontend API contract (JSON keys).
# validate_<fieldName> methods must match the camelCase field name.
"backend/settings/serializers.py" = ["N815", "N802"]
# cv2 import is wrapped in try/except to detect availability at runtime;
# the symbol is used via HAS_CV2 flag, not directly referenced.
"worker/src/recognition/cache.py" = ["F401"]
# Windows platform files mirror Win32 API identifiers (D3D11_*, DXGI_*,
# PROCESS_*, SRCCOPY, COM vtable methods). CapWords/lowercase PEP8 rules
# do not apply to native API shims — suppressing N801/N802/N806/N816 here.
"worker/src/platforms/windows/*.py" = ["N801", "N802", "N806", "N816"]
"worker/src/__main__.py" = ["N806"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
plugins = ["mypy_django_plugin.main"]
# Centralize cache under .cache/ (see [tool.ruff] comment for rationale).
cache_dir = ".cache/mypy"

[tool.django-stubs]
django_settings_module = "config.settings.dev"

[tool.pytest.ini_options]
# pytest 用 config.settings.test (InMemory ChannelLayer, 无 Redis 连接, 加速测试).
# 运行环境 (manage.py / runserver / gunicorn) 各自硬编码 dev/prod — 不受此处影响.
# 对齐说明: test.py 继承 dev.py 仅覆盖 CHANNEL_LAYERS/Celery 为内存实现 (E, 2026-08-21).
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
# Add backend/ to sys.path so Django settings module (config.settings.test)
# is importable when pytest runs from repo root (N150 pre-existing config fix).
pythonpath = ["backend"]
# Centralize cache under .cache/ (see [tool.ruff] comment for rationale).
cache_dir = ".cache/pytest"

# Test markers for layer-based test splitting (TD-345).
# Default run: unit + integration (skip e2e tests that need external services).
markers = [
    "unit: Tests that don't need Django DB (pure logic, runnable with -p no:django)",
    "integration: Tests that need Django DB but no external services",
    "e2e: Tests that need external services (real ADB, ChromaDB, browser, etc.)",
]
# Default: skip e2e tests (external services).
# Override: -m "" to run all, -m e2e to run only e2e tests.
# Note: `markexpr` is not a pytest option (plugin-only); the standard
# way is addopts with -m. `-o addopts=""` (N194 scripts-tests runs)
# intentionally clears this so e2e scenarios can be selected manually.
addopts = ["-m", "not e2e"]

[tool.coverage.run]
source = ["backend"]
omit = [
    "backend/*/migrations/*",
    "backend/*/tests/*",
    "backend/config/settings/*",
    "backend/config/wsgi.py",
    "backend/config/asgi.py",
    "backend/manage.py",
    "backend/*/admin.py",
    "backend/*/apps.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
fail_under = 30
show_missing = true