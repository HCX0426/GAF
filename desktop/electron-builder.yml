appId: com.gaf.desktop
productName: GAF
copyright: Copyright © 2026 GAF

directories:
  output: release
  buildResources: resources

files:
  - dist/**/*
  - resources/**/*
  - "!node_modules"

extraResources:
  - from: "../frontend/dist"
    to: "frontend/dist"
    filter:
      - "**/*"

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  installerHeaderIcon: resources/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: GAF
  artifactName: GAF-Setup-${version}.${ext}

publish:
  provider: github
  owner: gaf-project
  repo: gaf
