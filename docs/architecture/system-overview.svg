<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 624" width="100%" height="auto" role="img" aria-label="GAF 全栈架构图">
  <style>
    :root {
      color-scheme: light;
      --surface: #F7F7F8;
      --surface-muted: #EFEFF2;
      --text: #171717;
      --text-muted: #52525B;
      --border: rgba(23, 23, 23, 0.12);
      --brand: #4B3FE3;
      --brand-soft: #F2F7FF;
      --brand-text: #1A1759;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --surface: #171717;
        --surface-muted: #262626;
        --text: #E5E5E5;
        --text-muted: #A1A1AA;
        --border: rgba(229, 229, 229, 0.12);
        --brand: #6054F1;
        --brand-soft: #1A1759;
        --brand-text: #CFD8FF;
      }
    }
    .t { fill: var(--text); font: 400 14px/20px "SF Pro Text","PingFang SC",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
    .th { fill: var(--text); font: 500 14px/20px "SF Pro Text","PingFang SC",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
    .ts { fill: var(--text-muted); font: 400 12px/18px "SF Pro Text","PingFang SC",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
    .tb { fill: var(--brand-text); font: 500 14px/20px "SF Pro Text","PingFang SC",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
    .arr { stroke: var(--text-muted); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .arrB { stroke: var(--brand); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .leader { stroke: var(--text-muted); stroke-width: 1; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 4 4; fill: none; }
    rect.n { fill: var(--surface); stroke: var(--border); rx: 8; }
    rect.f { fill: var(--brand-soft); stroke: var(--brand); rx: 8; }
    rect.bd { fill: none; stroke: var(--border); stroke-dasharray: 6 4; rx: 12; }
  </style>

  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L7 4 L1 7 Z" fill="var(--text-muted)"/></marker>
    <marker id="ab" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L7 4 L1 7 Z" fill="var(--brand)"/></marker>
  </defs>

  <text x="40" y="28" class="th" style="font-size:16px; line-height:24px;">GAF 全栈架构 — 前端 · 后端 · Agent · 设备 · AI 治理</text>

  <!-- Row 1: Frontend -->
  <rect x="64" y="56" width="276" height="48" class="f"/>
  <text x="202" y="76" text-anchor="middle" class="tb">Frontend · React 19</text>
  <text x="202" y="94" text-anchor="middle" class="ts">42 页面 · 9 大模块 · AntD · Zustand</text>

  <rect x="384" y="56" width="276" height="48" class="n"/>
  <text x="522" y="76" text-anchor="middle" class="th">Desktop · Electron</text>
  <text x="522" y="94" text-anchor="middle" class="ts">封装前端 + 后端 + Agent</text>

  <!-- Connector Frontend -> Backend -->
  <path class="arrB" d="M202 104 L202 138" marker-end="url(#ab)"/>
  <path class="leader" d="M522 104 L522 138" marker-end="url(#a)"/>
  <text x="536" y="124" class="ts">封装分发</text>

  <!-- Row 2: Backend container -->
  <rect x="40" y="140" width="640" height="136" class="bd"/>
  <text x="56" y="158" class="ts">Backend — Django 5.2 · DRF · Channels · Celery · Redis (16 app + device_bridge)</text>

  <rect x="60" y="170" width="286" height="46" class="f"/>
  <text x="203" y="189" text-anchor="middle" class="tb">业务核心 · 5 app</text>
  <text x="203" y="207" text-anchor="middle" class="ts">任务 · 账户 · 流水线 · 资源 · 设备</text>

  <rect x="374" y="170" width="286" height="46" class="n"/>
  <text x="517" y="189" text-anchor="middle" class="th">AI 模块 · 2 app</text>
  <text x="517" y="207" text-anchor="middle" class="ts">gaf_ai · skills · RAG · LangGraph</text>

  <rect x="60" y="226" width="286" height="44" class="n"/>
  <text x="203" y="244" text-anchor="middle" class="th">调度 · 运维</text>
  <text x="203" y="261" text-anchor="middle" class="ts">scheduler · monitors · notifications</text>

  <rect x="374" y="226" width="286" height="44" class="n"/>
  <text x="517" y="244" text-anchor="middle" class="th">基础设施 · 5+1</text>
  <text x="517" y="261" text-anchor="middle" class="ts">protocol · gaf_core · settings · plugins</text>

  <!-- Connector Backend -> Agent -->
  <path class="arrB" d="M280 276 L280 314" marker-end="url(#ab)"/>
  <rect x="292" y="282" width="128" height="22" rx="11" fill="var(--surface)" stroke="var(--border)"/>
  <text x="356" y="297" text-anchor="middle" class="ts">WebSocket 下发</text>

  <!-- Row 3: Agent container -->
  <rect x="40" y="316" width="640" height="132" class="bd"/>
  <text x="56" y="334" class="ts">Agent — 独立进程 · Python 3.11 (WebSocket 心跳 / 断线重连 / 本地状态机)</text>

  <rect x="60" y="344" width="286" height="46" class="n"/>
  <text x="203" y="363" text-anchor="middle" class="th">Pipeline 引擎</text>
  <text x="203" y="381" text-anchor="middle" class="ts">executor · 节点注册 · DAG · 校验</text>

  <rect x="374" y="344" width="286" height="46" class="n"/>
  <text x="517" y="363" text-anchor="middle" class="th">设备 · 平台抽象</text>
  <text x="517" y="381" text-anchor="middle" class="ts">Windows · ADB · 跨平台接口</text>

  <rect x="60" y="400" width="286" height="44" class="n"/>
  <text x="203" y="418" text-anchor="middle" class="th">识别 OCR</text>
  <text x="203" y="435" text-anchor="middle" class="ts">4 引擎 · 模板匹配 · 缓存</text>

  <rect x="374" y="400" width="286" height="44" class="n"/>
  <text x="517" y="418" text-anchor="middle" class="th">通信 Client</text>
  <text x="517" y="435" text-anchor="middle" class="ts">WebSocket · 心跳 · 设备同步</text>

  <!-- Connectors Agent -> Devices -->
  <path class="arr" d="M120 448 L120 486" marker-end="url(#a)"/>
  <path class="arr" d="M350 448 L350 486" marker-end="url(#a)"/>
  <path class="arr" d="M560 448 L560 486" marker-end="url(#a)"/>

  <!-- Row 4: Devices -->
  <rect x="60" y="488" width="180" height="46" class="n"/>
  <text x="150" y="507" text-anchor="middle" class="th">Windows</text>
  <text x="150" y="525" text-anchor="middle" class="ts">Win32 · 6 截图 · 3 输入</text>

  <rect x="260" y="488" width="180" height="46" class="n"/>
  <text x="350" y="507" text-anchor="middle" class="th">Android · ADB</text>
  <text x="350" y="525" text-anchor="middle" class="ts">scrcpy · minitouch · MaaTouch</text>

  <rect x="460" y="488" width="200" height="46" class="n"/>
  <text x="560" y="507" text-anchor="middle" class="th">macOS · Linux</text>
  <text x="560" y="525" text-anchor="middle" class="ts">backend 跨平台桥接</text>

  <!-- Row 5: Governance -->
  <rect x="64" y="560" width="592" height="44" class="f"/>
  <text x="360" y="579" text-anchor="middle" class="tb">AI 治理体系 · 开发层</text>
  <text x="360" y="596" text-anchor="middle" class="ts">gaf_init → gaf-orchestrator → .ai-memory → hooks（约束开发流程，不参与运行时数据流）</text>
</svg>
