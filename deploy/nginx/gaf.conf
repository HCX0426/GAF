# GAF nginx reverse proxy configuration (bare-metal deployment).
# Place at /etc/nginx/sites-available/gaf.conf and symlink to sites-enabled/.
#
# Required variables (replace before use):
#   SERVER_NAME  — domain or IP (e.g., gaf.example.com or _ for any)
#   BACKEND_HOST — gunicorn backend host:port (default: 127.0.0.1:8000)
#   FRONTEND_DIST — path to frontend build output (e.g., /opt/gaf/frontend/dist)

upstream gaf_backend {
    server 127.0.0.1:8000;
    # Add more backends here for horizontal scaling
    keepalive 32;
}

server {
    listen 80;
    server_name _;  # Replace with your domain

    # Redirect HTTP to HTTPS (uncomment after SSL is configured)
    # return 301 https://$host$request_uri;

    # P0-6 安全头 (评审 2026-09-05): 不依赖 TLS 即可生效的加固项。
    # TLS 本身仍需证书后启用 (见文件末尾注释段) — 启用 HTTPS 前先下调
    # prod.py 的 HSTS preload (D6)。
    server_tokens off;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Frontend SPA (built static files)
    root /opt/gaf/frontend/dist;
    index index.html;

    # Client body size (for uploads — task resources, backups)
    client_max_body_size 100m;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # SPA fallback — serve index.html for unknown routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy to backend (daphne ASGI)
    location /api/ {
        proxy_pass http://gaf_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Django admin
    location /admin/ {
        proxy_pass http://gaf_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket proxy (Agent connections, real-time updates)
    location /ws/ {
        proxy_pass http://gaf_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;  # 24h for long-lived WS
        proxy_send_timeout 86400s;
    }

    # Backend static files (collected via collectstatic)
    location /static/ {
        alias /opt/gaf/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Backend media files (user uploads)
    location /media/ {
        alias /opt/gaf/backend/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

